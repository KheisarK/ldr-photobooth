name: Merge backend history into main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge backend while preserving main conflict choices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin backend
          git merge origin/backend --allow-unrelated-histories -X ours -m "merge: integrate Spring Boot backend into main"
          git rm .github/workflows/merge-backend.yml
          git commit --amend --no-edit
          git push origin HEAD:main
